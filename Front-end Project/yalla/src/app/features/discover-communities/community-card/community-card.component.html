<div class="bg-surface-container-lowest rounded-[16px] p-lg border border-surface-variant/20 shadow-[0_2px_12px_rgba(128,0,32,0.03)] flex flex-col h-full hover:shadow-[0_4px_20px_rgba(128,0,32,0.06)] transition-shadow">
  <div class="flex items-center gap-xs mb-md flex-wrap">
    @for (tag of community.tags; track tag) {
      <span class="bg-surface-container px-3 py-1 rounded-full font-label-sm text-label-sm text-on-surface-variant">
        {{ tag }}
      </span>
    }
  </div>

  <h3 class="font-headline-md text-headline-md text-on-background mb-xs">{{ community.name }}</h3>
  <p class="font-body-md text-body-md text-on-surface-variant mb-lg flex-1">{{ community.description }}</p>

  <div class="flex items-center justify-between pt-md border-t border-secondary/10">
    <span class="font-label-sm text-label-sm text-on-surface-variant">{{ community.memberCount }} members</span>

    @switch (community.currentUserRole) {
      @case ('joined') {
        <button type="button" class="bg-surface-container-high text-burgundy-deep px-5 py-2 rounded-full font-label-md text-label-md flex items-center gap-xs border border-burgundy-deep/20" disabled>
          <span class="material-symbols-outlined text-[18px]">check</span> Joined
        </button>
      }
      @case ('joining') {
        <button type="button" class="bg-burgundy-deep/50 text-white px-5 py-2 rounded-full font-label-md text-label-md cursor-wait flex items-center gap-xs" disabled>
          <span class="material-symbols-outlined text-[18px] animate-spin">sync</span> Joining...
        </button>
      }
      @default {
        <button type="button" class="bg-burgundy-deep text-white px-5 py-2 rounded-full font-label-md text-label-md hover:bg-wine-dark transition-colors shadow-sm" (click)="onJoin()">
          + Join
        </button>
      }
    }
  </div>
</div>

<section class="mb-2xl text-center md:text-left">
  <h1 class="font-display-lg text-display-lg text-on-background mb-sm">{{ title }}</h1>
  <p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl">{{ subtitle }}</p>

  <div class="mt-xl max-w-xl relative">
    <!-- TODO: swap for <app-search> from common/search if it matches this style -->
    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
    <input
      class="w-full bg-surface-container-lowest border border-outline-variant rounded-full py-3 pl-12 pr-4 font-body-md text-on-background focus:outline-none focus:ring-2 focus:ring-burgundy-deep focus:border-burgundy-deep transition-shadow shadow-sm placeholder:text-on-surface-variant/70"
      type="text"
      [placeholder]="searchPlaceholder"
      (input)="onSearchInput($any($event.target).value)" />
  </div>
</section>

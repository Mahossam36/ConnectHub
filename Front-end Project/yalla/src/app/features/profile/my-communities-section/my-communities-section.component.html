<section class="my-communities-section">

  <!-- SECTION HEADER -->
  <div class="section-header">

    <h2>
      {{ heading }}
    </h2>

    <span class="active-count">
      {{ communities.length }} Active
    </span>

  </div>


  <!-- COMMUNITY GRID -->
  @if (communities.length > 0) {

    <div class="communities-grid">

      @for (community of communities; track community.id) {

        <app-community-card
          [community]="community"
          [showRole]="true">
        </app-community-card>

      }

    </div>

  } @else {

    <div class="empty-state">

      <span class="material-symbols-outlined">
        groups
      </span>

      <h3>No communities yet</h3>

      <p>
        Join or create a community to see it here.
      </p>

    </div>

  }

</section>

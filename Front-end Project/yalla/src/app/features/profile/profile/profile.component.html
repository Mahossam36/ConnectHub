<main class="profile-page">

  <div class="profile-container">

    <!-- PROFILE HEADER -->
    @if (user()) {

      <app-profile-header
        [user]="user()!"
        (editProfile)="onEditProfile()"
        (share)="onShareProfile()">
      </app-profile-header>

    }


    <!-- MY COMMUNITIES -->
    <app-my-communities-section
      heading="My Communities"
      [communities]="myCommunities()">
    </app-my-communities-section>

  </div>

</main>

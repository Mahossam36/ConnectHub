<div class="home-page">

  <!-- Page header -->
  <header class="home-header">

    <div>
      <h1>Home</h1>

      <p>
        See what's happening in your groups.
      </p>
    </div>

  </header>

  <!-- Report notification -->
  <div
    *ngIf="reportMessage"
    class="report-notification"
    role="status"
  >
    <span class="material-symbols-outlined">
      check_circle
    </span>

    <span>
      {{ reportMessage }}
    </span>

    <button
      type="button"
      aria-label="Dismiss"
      (click)="reportMessage = ''"
    >
      <span class="material-symbols-outlined">
        close
      </span>
    </button>
  </div>

  <!-- Error -->
  <div
    *ngIf="errorMessage"
    class="home-error"
    role="alert"
  >
    <span class="material-symbols-outlined">
      error
    </span>

    <span>
      {{ errorMessage }}
    </span>

    <button
      type="button"
      (click)="retry()"
    >
      Retry
    </button>
  </div>

  <!-- Initial loading -->
  <section
    *ngIf="isLoading"
    class="loading-state"
  >
    <span class="spinner"></span>

    <span>
      Loading posts...
    </span>
  </section>

  <!-- Empty state -->
  <section
    *ngIf="
      !isLoading &&
      !errorMessage &&
      posts.length === 0
    "
    class="empty-state"
  >
    <span class="material-symbols-outlined">
      dynamic_feed
    </span>

    <h2>No posts yet</h2>

    <p>
      There are no posts to show right now.
    </p>
  </section>

  <!-- Feed -->
  <main
    *ngIf="
      !isLoading &&
      posts.length > 0
    "
    class="feed"
  >

    <app-post
      *ngFor="
        let post of posts;
        trackBy: trackByPostId
      "
      [post]="post"
      [currentUserId]="currentUserId"
      (commentsClicked)="openComments($event)"
      (postDeleted)="removePost($event)"
      (likeChanged)="onPostLikeChanged($event)"
      (reportClicked)="reportPost($event)"
    ></app-post>

    <!-- Load more -->
    <div
      *ngIf="hasMorePosts()"
      class="load-more"
    >
      <button
        type="button"
        [disabled]="isLoadingMore"
        (click)="loadMorePosts()"
      >
        <span
          *ngIf="isLoadingMore"
          class="small-spinner"
        ></span>

        {{
          isLoadingMore
            ? 'Loading...'
            : 'Load more posts'
        }}
      </button>
    </div>

    <!-- End of feed -->
    <div
      *ngIf="
        !hasMorePosts() &&
        posts.length > 0
      "
      class="feed-end"
    >
      You're all caught up.
    </div>

  </main>

</div>

<!-- Comments drawer -->
<app-comments-panel
  *ngIf="selectedPost"
  [postId]="selectedPost.id"
  [postAuthorId]="selectedPost.author.id"
  [isOpen]="commentsOpen"
  (closed)="closeComments()"
  (commentCountChanged)="
    updateCommentCount($event)
  "
></app-comments-panel>

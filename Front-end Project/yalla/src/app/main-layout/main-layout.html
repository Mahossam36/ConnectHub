<div class="main-layout">

  <!-- NAVBAR -->
  <app-navbar
    (menuClicked)="sidePanelOpen = true"
    (logoutClicked)="logout()">
  </app-navbar>


  <!-- PAGE AREA -->
  <div class="page-area">

    <!-- ALWAYS VISIBLE SIDE PANEL (desktop only, hidden on mobile via SCSS) -->
    <app-fixed-side-panel></app-fixed-side-panel>


    <!-- MAIN CONTENT -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>

  </div>


  <!-- OVERLAY SIDE PANEL (mobile) -->
  <app-side-panel
    [isOpen]="sidePanelOpen"
    (closed)="sidePanelOpen = false"
    (logoutClicked)="logout()">
  </app-side-panel>


  <!-- GLOBAL CREATE-COMMUNITY MODAL (shared across all pages) -->
  <app-create-community-modal [active]="true" />

</div>
